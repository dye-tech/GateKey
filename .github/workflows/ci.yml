name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gatekey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/gatekey_test?sslmode=disable

      - name: Run race detector tests
        run: go test -race -short ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/gatekey_test?sslmode=disable

      - name: Check security-critical path coverage
        run: |
          echo "=== Security-Critical Path Coverage ==="
          go test -coverprofile=coverage-security.out ./internal/auth/... ./internal/crypto/... ./internal/pki/... ./internal/policy/...
          go tool cover -func=coverage-security.out | grep -E "^(github.com/gatekey-project/gatekey/internal/(auth|crypto|pki|policy)/|total:)"
          echo ""
          TOTAL=$(go tool cover -func=coverage-security.out | grep "^total:" | awk '{gsub(/%/, "", $3); print $3}')
          echo "Total security-critical coverage: ${TOTAL}%"
          if (( $(echo "$TOTAL < 60" | bc -l) )); then
            echo "::warning::Security-critical coverage ${TOTAL}% is below 60% target"
          else
            echo "Security-critical coverage meets 60% threshold"
          fi
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/gatekey_test?sslmode=disable

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build ${{ matrix.component.name }} (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        component:
          - name: Client
            binary: gatekey
            cmd: gatekey
          - name: Server
            binary: gatekey-server
            cmd: gatekey-server
          - name: Gateway
            binary: gatekey-gateway
            cmd: gatekey-gateway
          - name: WireGuard Gateway
            binary: gatekey-wireguard-gateway
            cmd: gatekey-wireguard-gateway
          - name: Admin CLI
            binary: gatekey-admin
            cmd: gatekey-admin
          - name: Hub
            binary: gatekey-hub
            cmd: gatekey-hub
          - name: Mesh Gateway
            binary: gatekey-mesh-gateway
            cmd: gatekey-mesh-gateway
          - name: WireGuard Hub
            binary: gatekey-wireguard-hub
            cmd: gatekey-wireguard-hub
          - name: WireGuard Mesh Gateway
            binary: gatekey-wireguard-mesh-gateway
            cmd: gatekey-wireguard-mesh-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build ${{ matrix.component.name }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o bin/${{ matrix.component.binary }}-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/${{ matrix.component.cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.component.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck || true

      - name: Build
        run: npm run build

  docker:
    name: Docker Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: Server
            binary: gatekey-server
            deps: ca-certificates tzdata
            tag: gatekey-server:test
          - name: Gateway
            binary: gatekey-gateway
            deps: ca-certificates tzdata openvpn nftables iptables iproute2
            tag: gatekey-gateway:test
          - name: WireGuard Gateway
            binary: gatekey-wireguard-gateway
            deps: ca-certificates tzdata wireguard-tools nftables iptables iproute2
            tag: gatekey-wireguard-gateway:test
          - name: Hub
            binary: gatekey-hub
            deps: ca-certificates tzdata openvpn nftables iptables iproute2
            tag: gatekey-hub:test
          - name: Mesh Gateway
            binary: gatekey-mesh-gateway
            deps: ca-certificates tzdata openvpn nftables iptables iproute2
            tag: gatekey-mesh-gateway:test
          - name: WireGuard Hub
            binary: gatekey-wireguard-hub
            deps: ca-certificates tzdata wireguard-tools nftables iptables iproute2
            tag: gatekey-wireguard-hub:test
          - name: WireGuard Mesh Gateway
            binary: gatekey-wireguard-mesh-gateway
            deps: ca-certificates tzdata wireguard-tools nftables iptables iproute2
            tag: gatekey-wireguard-mesh-gateway:test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BINARY=${{ matrix.image.binary }}
            RUNTIME_DEPS=${{ matrix.image.deps }}
          push: false
          tags: ${{ matrix.image.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-web:
    name: Docker Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          tags: gatekey-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
