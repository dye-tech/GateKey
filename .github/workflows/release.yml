name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build release binaries
        run: make release VERSION=${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build ${{ matrix.image }}
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gatekey-server
            binary: gatekey-server
            deps: ca-certificates tzdata
            title: GateKey Server
            description: GateKey Zero-Trust VPN Control Plane
            dockerfile: ./Dockerfile.server
          - image: gatekey-gateway
            binary: gatekey-gateway
            deps: ca-certificates tzdata openvpn nftables iptables iproute2
            title: GateKey Gateway
            description: GateKey Zero-Trust VPN Gateway Agent
          - image: gatekey-hub
            binary: gatekey-hub
            deps: ca-certificates tzdata openvpn nftables iptables iproute2
            title: GateKey Mesh Hub
            description: GateKey Zero-Trust VPN Mesh Hub Server (OpenVPN)
          - image: gatekey-wireguard-gateway
            binary: gatekey-wireguard-gateway
            deps: ca-certificates tzdata wireguard-tools nftables iptables iproute2
            title: GateKey WireGuard Gateway
            description: GateKey Zero-Trust VPN WireGuard Gateway Agent
          - image: gatekey-wireguard-hub
            binary: gatekey-wireguard-hub
            deps: ca-certificates tzdata wireguard-tools nftables iptables iproute2
            title: GateKey WireGuard Mesh Hub
            description: GateKey Zero-Trust VPN WireGuard Mesh Hub Server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_SECRET }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile || './Dockerfile' }}
          build-args: |
            BINARY=${{ matrix.binary }}
            RUNTIME_DEPS=${{ matrix.deps }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            dyetech/${{ matrix.image }}:${{ steps.version.outputs.VERSION }}
            dyetech/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=https://github.com/dye-tech/GateKey
            org.opencontainers.image.licenses=Apache-2.0

  docker-web:
    name: Build Web UI
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_SECRET }}

      - name: Build and push Web UI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          cache-from: type=gha,scope=gatekey-web
          cache-to: type=gha,mode=max,scope=gatekey-web
          tags: |
            dyetech/gatekey-web:${{ steps.version.outputs.VERSION }}
            dyetech/gatekey-web:latest
          labels: |
            org.opencontainers.image.title=GateKey Web UI
            org.opencontainers.image.description=GateKey Zero-Trust VPN Web Interface
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=https://github.com/dye-tech/GateKey
            org.opencontainers.image.licenses=Apache-2.0

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download release artifacts
        run: |
          mkdir -p dist
          for binary in gatekey gatekey-server gatekey-gateway gatekey-wireguard-gateway gatekey-admin gatekey-hub gatekey-mesh-gateway gatekey-wireguard-hub gatekey-wireguard-mesh-gateway; do
            for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
              curl -sL "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/${binary}-${{ steps.version.outputs.VERSION }}-${platform}.tar.gz" \
                -o "dist/${binary}-${{ steps.version.outputs.VERSION }}-${platform}.tar.gz"
            done
          done
          cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Checkout Homebrew Tap
        uses: actions/checkout@v7
        with:
          repository: dye-tech/homebrew-gatekey
          path: homebrew-gatekey
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew formulas
        run: |
          chmod +x scripts/update-homebrew.sh
          ./scripts/update-homebrew.sh ${{ steps.version.outputs.VERSION }} ./homebrew-gatekey

      - name: Push to Homebrew Tap
        run: |
          cd homebrew-gatekey
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update formulas for GateKey v${{ steps.version.outputs.VERSION }}"
          git tag -f "v${{ steps.version.outputs.VERSION }}"
          git push
          git push origin "v${{ steps.version.outputs.VERSION }}" --force

  update-helm-chart:
    name: Update Helm Chart
    needs: [release, docker, docker-web]
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Checkout Helm Chart
        uses: actions/checkout@v7
        with:
          repository: dye-tech/gatekey-helm-chart
          path: helm-chart
          ssh-key: ${{ secrets.HELM_CHART_DEPLOY_KEY }}

      - name: Update Helm chart version
        run: |
          cd helm-chart

          # Use same version for chart and app
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.VERSION }}/" Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ steps.version.outputs.VERSION }}\"/" Chart.yaml

          # Update all image tags in values.yaml
          sed -i "s/tag: \"[0-9]*\.[0-9]*\.[0-9]*\"/tag: \"${{ steps.version.outputs.VERSION }}\"/g" values.yaml

      - name: Push to Helm Chart repo
        run: |
          cd helm-chart
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: bump to v${{ steps.version.outputs.VERSION }}"
          git tag -f "v${{ steps.version.outputs.VERSION }}"
          git push
          git push origin "v${{ steps.version.outputs.VERSION }}" --force
