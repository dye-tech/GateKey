version: "2"

# GolangCI-Lint configuration (v2 format)
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional linters - essential ones only
    - bodyclose
    - dogsled
    - errorlint
    - exhaustive
    - gofmt
    - goimports
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - stylecheck
    - tparallel
    - unconvert
    - whitespace

  disable:
    - dupl
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - lll
    - mnd
    - noctx
    - prealloc
    - predeclared
    - revive
    - unparam
    - wsl

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - io.Copy
        - io.ReadAll
        - (io.Closer).Close
        - (*os/exec.Cmd).Run
        - (*os/exec.Cmd).Start
        - (net.Conn).Close
        - (*net/http.Response.Body).Close
        - encoding/json.Marshal
        - encoding/json.Unmarshal
        - (*encoding/json.Encoder).Encode
        - (*encoding/json.Decoder).Decode
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Sscanf
        - (net.Listener).Close
        - (*net/http.Server).Shutdown
        - (*go.uber.org/zap.Logger).Sync
        - os.Remove
        - os.RemoveAll
        - os.MkdirAll
        - crypto/rand.Read
        - (database/sql.DB).Exec
        - (github.com/jackc/pgx/v5/pgxpool.Pool).Exec

    errorlint:
      errorf: true
      asserts: false
      comparison: false

    exhaustive:
      default-signifies-exhaustive: true

    gofmt:
      simplify: true

    goimports:
      local-prefixes: github.com/gatekey-project/gatekey

    gosec:
      excludes:
        - G101
        - G104
        - G107
        - G115
        - G204
        - G304
        - G306
        - G402

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    misspell:
      locale: US

    nakedret:
      max-func-lines: 50

    nolintlint:
      require-explanation: false
      require-specific: true

    staticcheck:
      checks:
        - all
        - -SA5011
        - -SA9003

    stylecheck:
      checks:
        - all
        - -ST1000
        - -ST1003

  exclusions:
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - errcheck
          - gosec

      # Exclude some linters from running on generated files
      - path: generated
        linters:
          - all

      # Exclude known issues in third-party code
      - path: vendor/
        linters:
          - all

      # Allow more flexibility in cmd packages
      - path: cmd/
        linters:
          - errcheck
          - unused

      # Allow more flexibility in client code
      - path: internal/client/
        linters:
          - errcheck
          - unused

      # Allow more flexibility in firewall code
      - path: internal/firewall/
        linters:
          - errcheck

      # Allow more flexibility in openvpn config generation
      - path: internal/openvpn/
        linters:
          - unused

      # errcheck: Allow not checking Close/Write/Sync
      - path: '(.+)\.go$'
        text: "Error return value of .*.Close"
      - path: '(.+)\.go$'
        text: "Error return value of .*.Write"
      - path: '(.+)\.go$'
        text: "Error return value of .*.Sync"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

severity:
  default: warning
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - govet
      severity: error
